<!doctype html>
<html lang="lt" data-theme="light" data-style="liquid">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaunas dviračiu</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{
  --bg:#f5f7f9;--panel:#ffffff;--panel2:#f7f9fb;--ink:#16242b;--muted:#66757d;--line:#dfe7eb;
  --accent:#e9553f;--accent2:#2d6cdf;--green:#1d9b67;--yellow:#e3a400;--shadow:0 14px 40px rgba(16,30,38,.18);
  --glass:rgba(255,255,255,.78);--glass-strong:rgba(255,255,255,.9);--sheet-radius:26px;
}
html[data-theme="dark"]{
  --bg:#10181d;--panel:#172229;--panel2:#1b2a32;--ink:#edf4f6;--muted:#9dafb7;--line:#2a3c45;
  --accent:#ff725d;--accent2:#67a0ff;--green:#48d497;--yellow:#f2bf44;--shadow:0 18px 44px rgba(0,0,0,.35);
  --glass:rgba(20,31,38,.78);--glass-strong:rgba(20,31,38,.92);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,"Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}
button{cursor:pointer;color:inherit}
#map{position:fixed;inset:0;background:#dfe7e9}
.glass{background:var(--glass);backdrop-filter:blur(20px) saturate(1.18);-webkit-backdrop-filter:blur(20px) saturate(1.18);box-shadow:0 8px 28px rgba(0,0,0,.14);border:1px solid rgba(255,255,255,.38)}
html[data-style="classic"] .glass{background:var(--panel);backdrop-filter:none;-webkit-backdrop-filter:none;border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.brand{position:fixed;z-index:800;top:calc(env(safe-area-inset-top,0px) + 12px);left:14px;display:flex;align-items:center;gap:9px;padding:9px 13px;border-radius:18px;font-weight:800;letter-spacing:-.01em}
.brandMark{width:27px;height:27px;border-radius:10px;display:grid;place-items:center;background:var(--accent);color:white;font-size:16px;box-shadow:0 5px 15px rgba(233,85,63,.32)}
.brandTitle{white-space:nowrap}
.topActions{position:fixed;z-index:800;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;display:flex;gap:8px}
.iconBtn{width:44px;height:44px;border:0;border-radius:15px;display:grid;place-items:center;background:var(--glass);color:var(--ink);box-shadow:0 8px 28px rgba(0,0,0,.14);border:1px solid rgba(255,255,255,.38)}
html[data-style="classic"] .iconBtn{background:var(--panel);border-color:var(--line)}
.iconBtn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#status{position:fixed;z-index:900;top:calc(env(safe-area-inset-top,0px) + 68px);left:50%;transform:translateX(-50%);max-width:min(620px,calc(100% - 28px));padding:9px 13px;border-radius:14px;font-size:.82rem;display:none}
#status.show{display:flex;align-items:center;gap:8px}
#status .spinner{width:14px;height:14px;border:2px solid rgba(127,127,127,.25);border-top-color:currentColor;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

#locationFab{position:fixed;z-index:700;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);width:50px;height:50px;border:0;border-radius:17px;display:grid;place-items:center;background:var(--glass-strong);box-shadow:0 10px 28px rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.38)}
#locationFab svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#locationFab.located svg{stroke:var(--accent2)}
#scale{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 94px);z-index:650;display:none}
.leaflet-control-scale{margin:0!important;border:none!important;background:transparent!important;padding:0!important}
.leaflet-control-scale-line{border:0!important;border-left:2px solid var(--ink)!important;border-bottom:2px solid var(--ink)!important;color:var(--ink)!important;background:var(--glass-strong)!important;border-radius:8px!important;padding:3px 7px!important;font-size:11px!important;font-weight:700!important;box-shadow:0 5px 15px rgba(0,0,0,.12)}

#sheet{position:fixed;z-index:1000;left:50%;bottom:0;width:min(610px,calc(100vw - 24px));height:min(82vh,780px);background:var(--glass-strong);border:1px solid rgba(255,255,255,.45);border-bottom:0;border-radius:var(--sheet-radius) var(--sheet-radius) 0 0;box-shadow:var(--shadow);display:flex;flex-direction:column;transform:translate3d(-50%,100%,0);transition:transform .28s cubic-bezier(.22,.75,.24,1);overflow:hidden;will-change:transform}
html[data-style="classic"] #sheet{background:var(--panel);border-color:var(--line)}
#sheet.open{transform:translate3d(-50%,0,0)}
#sheet.dragging{transition:none}
#grab{padding:10px 0 8px;flex:none;touch-action:none}
#grab i{display:block;width:44px;height:5px;border-radius:99px;background:var(--line);margin:auto}
#body{overflow:auto;padding:2px 16px calc(118px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch;overscroll-behavior:contain;min-height:0}
.pageHead{padding:5px 2px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.pageHead h1{font-size:1.42rem;line-height:1.1;margin:0;letter-spacing:-.025em}
.pageHead p{margin:6px 0 0;color:var(--muted);font-size:.89rem;line-height:1.4}
.closeBtn{border:0;background:var(--panel2);width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none}
.closeBtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.sectionTitle{font-size:.76rem;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:18px 2px 9px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:19px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.04)}
html[data-style="liquid"] .card{background:rgba(255,255,255,.34)}
html[data-theme="dark"][data-style="liquid"] .card{background:rgba(255,255,255,.035)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px}
.row+.row{border-top:1px solid var(--line)}
.rowMain{min-width:0}.rowTitle{font-weight:760;font-size:.96rem}.rowSub{color:var(--muted);font-size:.78rem;margin-top:3px;line-height:1.35}
.iconBox{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--panel2);flex:none}.iconBox svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.switch{width:48px;height:30px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none;padding:0}.switch:after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:.18s}.switch.on{background:var(--accent)}.switch.on:after{transform:translateX(18px)}

.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:14px;padding:11px 14px;font-weight:720;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;transition:.16s}.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(0)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 8px 18px rgba(233,85,63,.25)}
.btn.secondary{background:var(--accent2);border-color:var(--accent2);color:#fff;box-shadow:0 8px 18px rgba(45,108,223,.2)}
.btn.ghost{background:transparent}.btn.full{width:100%}.btn.iconOnly{width:44px;padding:0}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid var(--line);background:var(--panel2);border-radius:99px;padding:8px 11px;font-size:.82rem;font-weight:700}.chip.on{background:var(--accent2);border-color:var(--accent2);color:white}

.navSearch{position:relative}.navInput{height:54px;width:100%;border:1px solid var(--line);border-radius:17px;background:var(--panel);padding:0 15px 0 46px;outline:none;color:var(--ink)}.navInput:focus{border-color:var(--accent2);box-shadow:0 0 0 4px rgba(45,108,223,.11)}.searchIcon{position:absolute;left:15px;top:17px;width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
.searchResults{margin-top:7px;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}.searchResults button{display:block;width:100%;border:0;background:none;text-align:left;padding:12px 13px;color:var(--ink)}.searchResults button+.searchResults button{border-top:1px solid var(--line)}
.quickGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.quick{display:flex;align-items:center;gap:11px;padding:13px;border:1px solid var(--line);background:var(--panel);border-radius:17px;text-align:left}.quickIcon{width:35px;height:35px;border-radius:12px;display:grid;place-items:center;background:var(--panel2);font-size:17px}.quick strong{display:block;font-size:.88rem}.quick small{display:block;color:var(--muted);font-size:.74rem;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.routeCard{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:13px;margin-top:11px}.routeTop{display:flex;align-items:center;justify-content:space-between;gap:10px}.routeMetric{font-size:1.34rem;font-weight:850;letter-spacing:-.02em}.routeMeta{font-size:.78rem;color:var(--muted)}
.routeChoices{display:flex;gap:7px;overflow:auto;padding-bottom:2px;margin-top:12px}.routeChoice{min-width:118px;text-align:left;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:15px;padding:10px}.routeChoice.on{border-color:var(--accent2);box-shadow:inset 0 0 0 1px var(--accent2);background:rgba(45,108,223,.08)}.routeChoice strong{display:block;font-size:.82rem}.routeChoice span{display:block;font-size:.74rem;color:var(--muted);margin-top:2px}
.steps{margin-top:13px;border-top:1px solid var(--line)}.step{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}.stepIcon{width:34px;height:34px;border-radius:11px;background:var(--panel2);display:grid;place-items:center;font-weight:800}.stepMain b{font-size:.84rem;display:block}.stepMain span{font-size:.73rem;color:var(--muted);display:block;margin-top:3px}.stepDist{font-size:.72rem;color:var(--muted);white-space:nowrap}.step.active{background:rgba(45,108,223,.07);border-radius:14px;padding:10px}.step.active .stepIcon{background:var(--accent2);color:white}

#pill{position:fixed;z-index:1100;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:99px;background:var(--glass-strong);border:1px solid rgba(255,255,255,.42);box-shadow:0 12px 32px rgba(0,0,0,.22)}
html[data-style="classic"] #pill{background:var(--panel);border-color:var(--line)}
#pill button{border:0;background:transparent;color:var(--muted);padding:10px 18px;border-radius:99px;font-weight:800;display:flex;align-items:center;gap:8px;min-width:112px;justify-content:center}#pill button[aria-selected="true"]{background:var(--accent);color:white;box-shadow:0 7px 18px rgba(233,85,63,.22)}
#pill svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

#centerPin{position:fixed;z-index:500;left:50%;top:50%;transform:translate(-50%,-100%);display:none;pointer-events:none}.pinHead{width:28px;height:28px;border-radius:50% 50% 50% 0;background:var(--accent);transform:rotate(-45deg);box-shadow:0 6px 16px rgba(0,0,0,.27);display:grid;place-items:center}.pinDot{width:8px;height:8px;border-radius:50%;background:white}.pinShadow{width:26px;height:8px;border-radius:50%;background:rgba(0,0,0,.25);filter:blur(3px);margin:10px auto 0;transform:scale(.75)}
#pickBar{position:fixed;z-index:1050;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);transform:translateX(-50%);display:none;width:min(400px,calc(100% - 28px));padding:10px;border-radius:19px;background:var(--glass-strong);border:1px solid rgba(255,255,255,.4);box-shadow:var(--shadow)}.pickInfo{font-size:.78rem;color:var(--muted);margin-bottom:8px;text-align:center}.pickBtn{width:100%}

#navMode{position:fixed;z-index:1200;inset:0;display:none;pointer-events:none}.navTop{position:absolute;left:14px;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;justify-content:center}.instructionCard{pointer-events:auto;width:min(580px,100%);padding:14px 16px;border-radius:20px;background:var(--glass-strong);border:1px solid rgba(255,255,255,.44);box-shadow:var(--shadow)}.instructionSmall{font-size:.74rem;color:var(--muted);font-weight:750}.instructionMain{font-size:1.17rem;font-weight:850;margin-top:4px;display:flex;align-items:center;gap:10px}.turnArrow{width:28px;height:28px;border-radius:9px;background:var(--accent2);color:#fff;display:grid;place-items:center;font-weight:900}.instructionDist{font-size:.78rem;color:var(--muted);margin-top:3px}.navBottom{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;justify-content:center}.navBottomCard{pointer-events:auto;width:min(580px,100%);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border-radius:19px;background:var(--glass-strong);border:1px solid rgba(255,255,255,.44);box-shadow:var(--shadow)}.navBottomCard .eta{font-weight:850}.navBottomCard .eta small{display:block;color:var(--muted);font-weight:650;font-size:.72rem;margin-top:2px}

.poiPopup{min-width:245px}.poiTitle{font-size:1.02rem;font-weight:850;margin-bottom:3px}.poiType{font-size:.74rem;color:var(--muted);margin-bottom:10px}.poiLine{display:flex;align-items:flex-start;gap:8px;font-size:.81rem;margin:7px 0}.poiLine b{font-size:.79rem}.poiActions{display:flex;gap:7px;margin-top:11px}.poiActions button{flex:1;border:0;border-radius:12px;padding:9px 10px;font-weight:780}.poiActions .go{background:var(--accent2);color:#fff}.poiActions .edit{background:#eef2f4;color:#203039}.hoursMissing{color:var(--yellow)}


#settingsPage{position:fixed;inset:0;z-index:1400;display:none;background:var(--bg);color:var(--ink)}
#settingsPage.open{display:block}
.settingsShell{height:100%;width:min(760px,100%);margin:0 auto;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(28px + env(safe-area-inset-bottom,0px))}
.settingsTop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.settingsTop h1{font-size:1.65rem;margin:0;letter-spacing:-.03em}.settingsTop p{margin:5px 0 0;color:var(--muted);font-size:.9rem}.settingsClose{width:44px;height:44px;border:0;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:1.5rem;display:grid;place-items:center}
html.pick-active .brand,html.pick-active .topActions,html.pick-active #locationFab,html.pick-active #pill,html.pick-active .leaflet-control-zoom,html.pick-active .leaflet-control-attribution{display:none!important}
html.pick-active #sheet{display:none!important}
#modal{position:fixed;inset:0;z-index:1500;background:rgba(3,10,14,.44);display:none;align-items:flex-end;justify-content:center;padding:14px}.modalCard{width:min(600px,100%);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:var(--shadow)}.modalHead{display:flex;align-items:center;justify-content:space-between;gap:10px}.modalHead h2{font-size:1.15rem;margin:0}.modalCard p{color:var(--muted);font-size:.8rem;line-height:1.4}.modalInput{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:14px;padding:12px;outline:none}.modalInput:focus{border-color:var(--accent2);box-shadow:0 0 0 4px rgba(45,108,223,.1)}.modalActions{display:flex;gap:8px;margin-top:10px}.modalActions .btn{flex:1}

.empty{padding:18px 12px;color:var(--muted);text-align:center;font-size:.84rem}.errorBox{padding:12px 14px;border:1px solid rgba(233,85,63,.35);background:rgba(233,85,63,.08);border-radius:15px;font-size:.8rem;color:var(--ink)}
.divider{height:1px;background:var(--line);margin:17px 0}
.textInput{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:12px 13px;border-radius:14px;outline:none}.textInput:focus{border-color:var(--accent2);box-shadow:0 0 0 4px rgba(45,108,223,.1)}
.settingOption{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;background:var(--panel);border:1px solid var(--line);border-radius:15px}.settingOption+.settingOption{margin-top:8px}.settingOption b{display:block;font-size:.86rem}.settingOption span{display:block;color:var(--muted);font-size:.73rem;margin-top:2px}.seg{display:flex;background:var(--panel2);border:1px solid var(--line);padding:3px;border-radius:13px;gap:3px}.seg button{border:0;background:transparent;border-radius:10px;padding:8px 10px;font-size:.76rem;font-weight:780}.seg button.on{background:var(--accent2);color:#fff}

.leaflet-control-zoom{border:0!important;box-shadow:0 9px 24px rgba(0,0,0,.14)!important;margin-top:calc(env(safe-area-inset-top,0px) + 66px)!important;margin-right:14px!important}.leaflet-control-zoom a{width:42px!important;height:42px!important;line-height:42px!important;background:var(--glass-strong)!important;color:var(--ink)!important;border:0!important;text-align:center!important}.leaflet-control-zoom a:first-child{border-radius:14px 14px 0 0;border-bottom:1px solid var(--line)!important}.leaflet-control-zoom a:last-child{border-radius:0 0 14px 14px}.leaflet-control-attribution{font-size:8px!important;background:rgba(255,255,255,.72)!important}
@media (min-width:800px){#locationFab{bottom:28px;right:24px}.brand{left:18px}.topActions{right:18px}}
@media (max-width:500px){#sheet{height:86vh}.brandTitle{display:none}.brand{width:44px;height:44px;padding:0;justify-content:center}.quick small{max-width:120px}#pill button{min-width:126px;padding-inline:15px}}
</style>
</head>
<body>
<div id="map"></div>
<div class="brand glass"><div class="brandMark">🚲</div><div class="brandTitle">Kaunas dviračiu</div></div>
<div class="topActions">
  <button class="iconBtn" id="settingsBtn" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06-1.9 1.9-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V20h-2.68v-.11A1.7 1.7 0 0 0 9.2 18.3a1.7 1.7 0 0 0-1.87.34l-.06.06-1.9-1.9.06-.06A1.7 1.7 0 0 0 5.77 15a1.7 1.7 0 0 0-1.56-1.04H4v-2.7h.11A1.7 1.7 0 0 0 5.8 10.2a1.7 1.7 0 0 0-.34-1.87l-.06-.06 1.9-1.9.06.06A1.7 1.7 0 0 0 9.2 6.77 1.7 1.7 0 0 0 10.24 5.2V5h2.68v.2A1.7 1.7 0 0 0 14 6.77a1.7 1.7 0 0 0 1.87-.34l.06-.06 1.9 1.9-.06.06A1.7 1.7 0 0 0 17.43 10a1.7 1.7 0 0 0 1.56 1.04H19v2.7h-.01A1.7 1.7 0 0 0 19.4 15Z"/></svg></button>
</div>
<div id="status" class="glass"><span class="spinner"></span><span id="statusText"></span></div>
<button id="locationFab" aria-label="Center on my location"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg></button>
<div id="scale"></div>
<div id="centerPin"><div class="pinHead"><div class="pinDot"></div></div><div class="pinShadow"></div></div>
<div id="pickBar"><div class="pickInfo" id="pickInfo"></div><button class="btn primary pickBtn" id="pickSelect">Select this location</button></div>

<div id="sheet"><div id="grab"><i></i></div><div id="body"></div></div>
<div id="pill">
  <button id="tMap" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/></svg><span>Map</span></button>
  <button id="tNav" aria-selected="false"><svg viewBox="0 0 24 24"><path d="m3 11 18-8-8 18-2-8-7-2Z"/></svg><span>Navigate</span></button>
</div>

<div id="navMode">
  <div class="navTop"><div class="instructionCard"><div class="instructionSmall" id="navSmall"></div><div class="instructionMain"><div class="turnArrow" id="turnArrow">↑</div><div id="navInstruction"></div></div><div class="instructionDist" id="navInstructionDist"></div></div></div>
  <div class="navBottom"><div class="navBottomCard"><div class="eta" id="navEta"></div><button class="btn primary" id="stopNav">Exit navigation</button></div></div>
</div>

<div id="settingsPage"><div class="settingsShell"><div class="settingsTop"><div><h1 id="settingsTitle">Settings</h1><p id="settingsSubtitle"></p></div><button class="settingsClose" id="settingsClose" aria-label="Close settings">×</button></div><div id="settingsBody"></div></div></div>
<div id="modal"><div class="modalCard" id="modalBody"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);

async function overpass(q){let last;for(const ep of EPS){try{const c=new AbortController();const timer=setTimeout(()=>c.abort(),18000);const res=await fetch(ep+"?data="+encodeURIComponent(q),{method:"GET",mode:"cors",cache:"no-store",signal:c.signal});clearTimeout(timer);if(!res.ok)throw new Error("HTTP "+res.status);const j=await res.json();if(!j||!Array.isArray(j.elements))throw new Error("Invalid response");return j}catch(e){last=e}}throw last||new Error("Overpass unavailable")}

function drawLayer(kind){const g=layerGroups[kind];g.clearLayers();for(const e of layerCache[kind]||[]){if(!e.geometry&&!e.center&&!e.lat)continue;const ll=parseLL(e),tg=e.tags||{};if(kind==="cycle"&&e.geometry){const coords=e.geometry.map(p=>[p.lat,p.lon]);const hw=tg.highway||"";const dedicated=hw==="cycleway";const hasLane=!!(tg.cycleway||tg["cycleway:left"]||tg["cycleway:right"]||tg["cycleway:both"]);if(!dedicated&&!hasLane)continue;L.polyline(coords,{color:dedicated?"#e44c37":"#ef9d43",weight:dedicated?5:3.5,opacity:.92,dashArray:dedicated?null:"8 7"}).bindTooltip(dedicated?"🚲 "+(lang==="lt"?"Dviračių takas":"Cycleway"):"🚲 "+(lang==="lt"?"Dviračių juosta":"Bike lane")).addTo(g)}else{const color={shops:"#276d8a",repair:"#d6a000",rental:"#2c9f6a"}[kind];const marker=L.circleMarker(ll,{radius:9,color:"#fff",weight:2,fillColor:color,fillOpacity:1});marker.on("click",()=>showPOIPopup(e,kind));marker.addTo(g)}}}
async function loadLayer(kind){
 if(layerLoading[kind])return;
 layerLastCenter[kind]=map.getCenter();
 if(kind==="cycle"&&map.getZoom()<12){showLayerError(kind,lang==="lt"?"Priartinkite žemėlapį, kad būtų įkelta infrastruktūra.":"Zoom in to load cycling infrastructure.",false);return}
 layerLoading[kind]=true;showLayerError(kind,t("finding"),true);
 const bb=bboxForQuery();let q="";
 if(kind==="cycle")q=`[out:json][timeout:20];(way["highway"="cycleway"](${bb});way["highway"="path"]["bicycle"~"^(yes|designated|permissive)$"](${bb});way["highway"="footway"]["bicycle"~"^(yes|designated|permissive)$"](${bb});way["cycleway"](${bb});way["cycleway:left"](${bb});way["cycleway:right"](${bb});way["cycleway:both"](${bb}););out geom qt;`;
 else if(kind==="shops")q=`[out:json][timeout:20];nwr["shop"="bicycle"](${bb});out center qt;`;
 else if(kind==="repair")q=`[out:json][timeout:20];(nwr["amenity"="bicycle_repair_station"](${bb});nwr["service:bicycle:repair"="yes"](${bb}));out center qt;`;
 else q=`[out:json][timeout:20];(nwr["amenity"="bicycle_rental"](${bb});nwr["rental"="bicycle"](${bb}));out center qt;`;
 try{const j=await overpass(q);layerCache[kind]=j.elements||[];drawLayer(kind);showLayerError(kind,"",false)}catch(e){showLayerError(kind,(lang==="lt"?"Nepavyko įkelti: ":"Couldn’t load: ")+(e?.message||"network error"),false)}finally{layerLoading[kind]=false}
}
function toggleLayer(kind){layerState[kind]=!layerState[kind];if(layerState[kind]){layerGroups[kind].addTo(map);if(!layerCache[kind])loadLayer(kind)}else map.removeLayer(layerGroups[kind]);render()}
map.on("moveend",()=>{const c=map.getCenter();for(const k of Object.keys(layerState)){if(!layerState[k]||layerLoading[k])continue;const prev=layerLastCenter[k];if(!prev||map.distance(prev,c)>1700)loadLayer(k)}});

let userPosition=null,userMarker=null,userAccuracy=null,watchId=null;
function setGPS(p,center=false){userPosition=[p.coords.latitude,p.coords.longitude];if(!userMarker){userMarker=L.circleMarker(userPosition,{radius:8,color:"#fff",weight:3,fillColor:"#2d6cdf",fillOpacity:1,zIndexOffset:1000}).addTo(map)}else userMarker.setLatLng(userPosition);if(!userAccuracy)userAccuracy=L.circle(userPosition,{radius:Math.max(5,p.coords.accuracy||20),color:"#2d6cdf",weight:1,fillColor:"#2d6cdf",fillOpacity:.1}).addTo(map);else userAccuracy.setLatLng(userPosition).setRadius(Math.max(5,p.coords.accuracy||20));$("locationFab").classList.add("located");if(center)map.flyTo(userPosition,16,{duration:.7});status("")}
async function locate(center=true,setFrom=false){
 if(!navigator.geolocation){status(t("locErr"));return}
 try{const p=await navigator.permissions?.query?.({name:"geolocation"});if(p?.state==="denied"){status(lang==="lt"?"Vietos leidimas užblokuotas. Įjunkite Location naršyklės svetainės nustatymuose.":"Location permission is blocked. Allow Location in this site's browser settings.");return}}catch{}
 status(t("locating"),true);
 const success=p=>{setGPS(p,center);if(setFrom)setNavPoint("from",userPosition,t("gps"))};
 const fallback=e=>{if(e?.code===1){status(lang==="lt"?"Vietos leidimas atmestas. Leiskite naršyklei naudoti vietą.":"Location access was denied. Allow location for this site and try again.");return}navigator.geolocation.getCurrentPosition(success,err=>{status(err?.code===3?(lang==="lt"?"Vietos nustatymas užtruko. Pabandykite lauke.":"Getting a GPS fix timed out. Try outdoors."):t("locErr"))},{enableHighAccuracy:true,timeout:14000,maximumAge:0})};
 navigator.geolocation.getCurrentPosition(success,fallback,{enableHighAccuracy:false,timeout:7000,maximumAge:30000});
}
function startWatch(){if(watchId!==null||!navigator.geolocation)return;watchId=navigator.geolocation.watchPosition(p=>{setGPS(p,false);if(navActive)updateNavProgress()},()=>{}, {enableHighAccuracy:true,maximumAge:3000,timeout:12000})}
function stopWatch(){if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}}

function brouterUrl(a,b,alt){const p=new URLSearchParams({lonlats:`${a[1]},${a[0]}|${b[1]},${b[0]}`,profile:"trekking",alternativeidx:String(alt),format:"geojson",timode:"1"});const opts={avoid_unsafe:1,consider_elevation:1,consider_river:1,uphillcost:24};for(const [k,v] of Object.entries(opts))p.set("profile:"+k,String(v));return "https://brouter.de/brouter?"+p}
function hav(a,b){const R=6371000,p1=a[0]*Math.PI/180,p2=b[0]*Math.PI/180,dp=(b[0]-a[0])*Math.PI/180,dl=(b[1]-a[1])*Math.PI/180,x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.min(1,Math.sqrt(x)))}
function coordsFromFeature(f){return f?.geometry?.coordinates?.map(c=>[c[1],c[0]])||[]}
function pathDistance(c){let d=0;for(let i=1;i<c.length;i++)d+=hav(c[i-1],c[i]);return d}
function dedupeRoutes(rs){const out=[];for(const r of rs){if(r.coords.length<2)continue;const near=out.some(x=>Math.abs(x.distance-r.distance)<250&&x.coords.length===r.coords.length&&x.coords.every((p,i)=>i%Math.max(1,Math.floor(x.coords.length/8))!==0||hav(p,r.coords[i])<90));if(!near)out.push(r)}return out}
function parseHints(props,coords){const arr=props?.messages;if(Array.isArray(arr)){const out=[];for(const m of arr){if(!m)continue;const text=typeof m==="string"?m:(m.message||m.text||"");const ll=m.lat&&m.lon?[+m.lat,+m.lon]:null;if(text&&ll)out.push({type:"hint",text,ll})}if(out.length)return out}return null}
function makeTurnSteps(coords){if(coords.length<8)return [{type:"start",text:lang==="lt"?"Išvažiuokite iš starto":"Leave the start",ll:coords[0],distanceToNext:0}];const steps=[{type:"start",text:lang==="lt"?"Pradėkite važiuoti":"Start riding",ll:coords[0],distanceToNext:0}];let acc=0;let lastTurn=0;for(let i=2;i<coords.length-2;i+=2){acc+=hav(coords[i-2],coords[i]);if(acc<75||i-lastTurn<10)continue;const a=coords[i-4],b=coords[i-1],c=coords[i+3];if(!a||!b||!c)continue;const h1=Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI;const h2=Math.atan2(c[1]-b[1],c[0]-b[0])*180/Math.PI;let diff=((h2-h1+540)%360)-180;if(Math.abs(diff)<28)continue;const type=diff<0?"left":"right";steps.push({type,text:lang==="lt"?(type==="left"?"Pasukite kairėn":"Pasukite dešinėn"):(type==="left"?"Turn left":"Turn right"),ll:b,distanceToNext:0});acc=0;lastTurn=i}steps.push({type:"end",text:t("arrive"),ll:coords[coords.length-1],distanceToNext:0});for(let i=0;i<steps.length-1;i++){let d=0;const a=steps[i].ll,b=steps[i+1].ll;for(const p of coords){d+=0; if(hav(a,p)<8){break}}steps[i].distanceToNext=hav(a,b)}return steps}
async function brouterRoute(a,b,alt){const r=await fetch(brouterUrl(a,b,alt),{mode:"cors",cache:"no-store",headers:{Accept:"application/geo+json, application/json"}});if(!r.ok)throw new Error("BRouter HTTP "+r.status);const j=await r.json();const f=j.type==="FeatureCollection"?j.features?.[0]:j;const coords=coordsFromFeature(f);if(coords.length<2)throw new Error("No geometry");const pr=f.properties||{};const distance=Number(pr["track-length"])||pathDistance(coords);const time=Number(pr["total-time"])||distance/4.5;const ascend=Number(pr["filtered ascend"])||0;return{coords,distance,time,ascend,source:"brouter",label:alt===0?t("recommended"):alt===1?t("balanced"):t("fast"),steps:parseHints(pr,coords)||makeTurnSteps(coords)} }
async function getRoute(){if(!nav.from||!nav.to){status(t("noRoute"));return}const req=++routeRequest;routeCandidates=[];selectedRoute=0;render();status(t("finding"),true);try{const got=await Promise.allSettled([0,1,2].map(i=>brouterRoute(nav.from.ll,nav.to.ll,i)));if(req!==routeRequest)return;routeCandidates=dedupeRoutes(got.filter(x=>x.status==="fulfilled").map(x=>x.value));if(!routeCandidates.length)throw new Error("No routes");const shortest=Math.min(...routeCandidates.map(r=>r.distance));const pool=routeCandidates.filter(r=>r.distance<=shortest*1.24);const best=pool.sort((a,b)=>(a.distance+a.ascend*42)-(b.distance+b.ascend*42))[0];selectedRoute=Math.max(0,routeCandidates.indexOf(best));drawRoutes();status("");render();if(routeLine)map.fitBounds(routeLine.getBounds(),{paddingTopLeft:[25,110],paddingBottomRight:[25,220],maxZoom:16})}catch(e){if(req!==routeRequest)return;status(t("routeErr"));routeCandidates=[];render()}}
function drawRoutes(){routeLayers.forEach(l=>routeLayer.removeLayer(l));routeLayers=[];for(let i=0;i<routeCandidates.length;i++){const r=routeCandidates[i];const line=L.polyline(r.coords,{color:i===selectedRoute?"#2d6cdf":"#7e8d95",weight:i===selectedRoute?7:4,opacity:i===selectedRoute?.96:.44,dashArray:i===selectedRoute?null:"8 7",lineCap:"round",lineJoin:"round"}).addTo(routeLayer);line.on("click",()=>selectRoute(i));routeLayers.push(line)}routeLine=routeLayers[selectedRoute]||null}
const routeLayer=L.layerGroup().addTo(map);
function selectRoute(i){if(!routeCandidates[i])return;selectedRoute=i;drawRoutes();render();if(routeLine)map.fitBounds(routeLine.getBounds(),{paddingTopLeft:[25,110],paddingBottomRight:[25,220],maxZoom:16})}
function startNavigation(){if(!routeCandidates[selectedRoute]){status(t("noRoute"));return}navActive=true;navStepIndex=0;if(!userPosition)locate(false,false);startWatch();$("navMode").style.display="block";if(routeLine)map.fitBounds(routeLine.getBounds(),{paddingTopLeft:[20,120],paddingBottomRight:[20,180],maxZoom:17});updateNavOverlay();}
function stopNavigation(){navActive=false;stopWatch();$("navMode").style.display="none"}
$("stopNav").onclick=stopNavigation;
function closestRoutePoint(pos,coords){let bi=0,bd=Infinity;for(let i=0;i<coords.length;i++){const d=hav(pos,coords[i]);if(d<bd){bd=d;bi=i}}return{index:bi,distance:bd}}
function updateNavProgress(){const r=routeCandidates[selectedRoute];if(!r||!userPosition)return;const c=closestRoutePoint(userPosition,r.coords);let best=0,bestD=Infinity;for(let i=0;i<Math.min(navSteps.length,Math.max(1,navStepIndex+4));i++){const d=hav(userPosition,navSteps[i].ll);if(d<bestD){bestD=d;best=i}}if(best>navStepIndex&&bestD<45)navStepIndex=best;updateNavOverlay()}
function updateNavOverlay(){const r=routeCandidates[selectedRoute];if(!r)return;navSteps=r.steps||[];const s=navSteps[Math.min(navStepIndex,navSteps.length-1)]||{text:t("continue"),distanceToNext:0,type:"straight"};$("navSmall").textContent=navActive?t("live"):t("nextTurn");$("navInstruction").textContent=s.text;$("navInstructionDist").textContent=t("inDistance")(s.distanceToNext||0);$("turnArrow").textContent=s.type==="left"?"←":s.type==="right"?"→":s.type==="end"?"✓":"↑";const remain=Math.max(0,r.distance-(navSteps.slice(0,navStepIndex+1).reduce((a,x)=>a+(x.distanceToNext||0),0)));$("navEta").innerHTML=`${(remain/1000).toFixed(1)} km <small>${t("eta")} · ${t("minutes")((remain/4.5))}</small>`}

function clearRoute(){routeCandidates=[];selectedRoute=0;routeLayers.forEach(l=>routeLayer.removeLayer(l));routeLayers=[];routeLine=null;routeRequest++;if(navActive)stopNavigation();render()}

// ---------------- Sheet / UI ----------------
const sheet=$("sheet"),body=$("body");let tab=null;let sheetOpen=false;let drag=null,dragRaf=0;
function setSheetOpen(open){sheetOpen=!!open;sheet.classList.toggle("open",sheetOpen);sheet.classList.remove("dragging");sheet.style.transform=sheetOpen?"translate3d(-50%,0,0)":"translate3d(-50%,100%,0)";if(!sheetOpen){tab=null;$("tMap").setAttribute("aria-selected","false");$("tNav").setAttribute("aria-selected","false")}}
function openSheet(next){if(document.documentElement.classList.contains("pick-active"))return;setSettingsOpen(false);tab=next;setSheetOpen(true);$("tMap").setAttribute("aria-selected",next==="map");$("tNav").setAttribute("aria-selected",next==="nav");render();setTimeout(()=>map.invalidateSize(),220)}
function closeSheet(){setSheetOpen(false)}
function dragStart(y){if(!sheetOpen)return;drag={start:y,offset:0};sheet.classList.add("dragging")}
function dragMove(y,e){if(!drag)return;const dy=y-drag.start;drag.offset=Math.max(0,dy);if(e?.cancelable)e.preventDefault();const d=drag;if(!dragRaf){dragRaf=requestAnimationFrame(()=>{sheet.style.transform=`translate3d(-50%,${d.offset}px,0)`;dragRaf=0})}}
function dragEnd(){if(!drag)return;const d=drag;drag=null;sheet.classList.remove("dragging");if(d.offset>Math.min(190,sheet.offsetHeight*.3))closeSheet();else sheet.style.transform="translate3d(-50%,0,0)"}
$("grab").addEventListener("touchstart",e=>dragStart(e.touches[0].clientY),{passive:true});$("grab").addEventListener("touchmove",e=>dragMove(e.touches[0].clientY,e),{passive:false});$("grab").addEventListener("touchend",dragEnd);$("grab").addEventListener("touchcancel",dragEnd);$("grab").addEventListener("mousedown",e=>dragStart(e.clientY));window.addEventListener("mousemove",e=>dragMove(e.clientY,e));window.addEventListener("mouseup",dragEnd);
function renderMap(){body.innerHTML=`<div class="pageHead"><div><h1>${t("layers")}</h1><p>${t("layersSub")}</p></div><button class="closeBtn" data-close>×</button></div><div class="card">${layerRow("cycle","🚲",t("cycle"),lang==="lt"?"Dviračių takai ir pažymėtos juostos":"Cycleways and mapped lanes")}${layerRow("shops","🚲",t("shops"),lang==="lt"?"Parduotuvės su OSM informacija":"Shops with OSM details")}${layerRow("repair","🔧",t("repair"),lang==="lt"?"Remonto vietos":"Repair points")}${layerRow("rental","🚴",t("rental"),lang==="lt"?"Nuomos vietos":"Rental points")}</div><div class="sectionTitle">${lang==="lt"?"Greita prieiga":"Quick access"}</div><div class="quickGrid"><button class="quick" id="mapLocate"><div class="quickIcon">⌖</div><div><strong>${t("center")}</strong><small>${userPosition?t("located"):t("gps")}</small></div></button><button class="quick" id="mapNav"><div class="quickIcon">➤</div><div><strong>${t("nav")}</strong><small>${nav.to?.label||t("notSet")}</small></div></button></div><div class="sectionTitle">OpenStreetMap</div><div class="row" style="padding:13px 2px 0;color:var(--muted);font-size:.76rem;line-height:1.45">${lang==="lt"?"Dviračių ir vietų duomenys gaunami tiesiai iš OpenStreetMap per Overpass. Jei konkretus sluoksnis neatsidaro, jo klaida rodoma tik prie to sluoksnio.":"Cycling and place data comes directly from OpenStreetMap through Overpass. A failed layer is isolated to that layer instead of breaking the map."}</div>`;bindCommon();Object.keys(layerState).forEach(k=>{if(layerState[k]&&!layerCache[k])loadLayer(k)})}
function layerRow(k,icon,title,sub){return`<div class="row"><div style="display:flex;gap:11px;align-items:center;min-width:0"><div class="iconBox">${icon}</div><div class="rowMain"><div class="rowTitle">${title}</div><div class="rowSub">${sub}</div></div></div><button class="switch ${layerState[k]?"on":""}" data-layer="${k}" aria-label="${title}"></button></div><div id="layerMsg-${k}" style="display:none;padding:0 15px 12px"></div>`}
function renderNav(){const h=savedPlace("home"),w=savedPlace("work");const routeHtml=routeCandidates.length?`<div class="sectionTitle">${t("routes")}</div><div class="routeChoices">${routeCandidates.map((r,i)=>`<button class="routeChoice ${i===selectedRoute?"on":""}" data-route="${i}"><strong>${esc(r.label)}</strong><span>${(r.distance/1000).toFixed(1)} km · ${Math.round(r.time/60)} min</span></button>`).join("")}</div><div class="routeCard"><div class="routeTop"><div><div class="routeMetric">${(routeCandidates[selectedRoute].distance/1000).toFixed(1)} km</div><div class="routeMeta">${Math.round(routeCandidates[selectedRoute].time/60)} min · +${Math.round(routeCandidates[selectedRoute].ascend)} m</div></div><button class="btn primary" id="startNavBtn">${t("start")}</button></div><div class="steps">${(routeCandidates[selectedRoute].steps||[]).slice(0,12).map((s,i)=>`<div class="step ${i===navStepIndex?"active":""}"><div class="stepIcon">${s.type==="left"?"←":s.type==="right"?"→":s.type==="end"?"✓":"↑"}</div><div class="stepMain"><b>${esc(s.text)}</b><span>${s.type==="end"?"":t("routeSource")}</span></div><div class="stepDist">${s.distanceToNext?t("inDistance")(s.distanceToNext):""}</div></div>`).join("")}</div></div>`:nav.to?`<div class="routeCard"><div class="routeMeta">${t("finding")}</div></div>`:"";
body.innerHTML=`<div class="pageHead"><div><h1>${t("nav")}</h1><p>${routeCandidates.length?t("routeSource"):lang==="lt"?"Kur važiuojame šiandien?":"Where are you riding today?"}</p></div><button class="closeBtn" data-close>×</button></div><div class="sectionTitle">${t("from")}</div><div class="quickGrid"><button class="quick" id="useGps"><div class="quickIcon">⌖</div><div><strong>${t("gps")}</strong><small>${nav.from?.label||t("notSet")}</small></div></button><button class="quick" id="pickFrom"><div class="quickIcon">📍</div><div><strong>${t("pick")}</strong><small>${lang==="lt"?"Smeigtukas centre":"Pin in center"}</small></div></button></div><div class="sectionTitle">${t("to")}</div><div class="navSearch"><svg class="searchIcon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="navSearch" class="navInput" placeholder="${t("search")}" value="${nav.to?.label||""}"><div id="searchResults" class="searchResults"></div></div><div class="quickGrid" style="margin-top:9px"><button class="quick" id="homeQuick"><div class="quickIcon">⌂</div><div><strong>${t("routeToHome")}</strong><small>${h?.address||t("notSet")}</small></div></button><button class="quick" id="workQuick"><div class="quickIcon">▣</div><div><strong>${t("routeToWork")}</strong><small>${w?.address||t("notSet")}</small></div></button></div><div class="btns" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px"><button class="btn" id="pickTo">📍 ${t("pick")}</button><button class="btn" id="clearNav">${t("clear")}</button></div>${routeHtml}<div class="sectionTitle">${t("places")}</div><div class="card"><div class="row"><div class="rowMain"><div class="rowTitle">⌂ ${t("home")}</div><div class="rowSub">${h?.address||t("notSet")}</div></div><button class="btn" id="saveHome">${t("save")}</button></div><div class="row"><div class="rowMain"><div class="rowTitle">▣ ${t("work")}</div><div class="rowSub">${w?.address||t("notSet")}</div></div><button class="btn" id="saveWork">${t("save")}</button></div></div>`;bindNavEvents()}
function renderSettings(){const th=settings.theme,st=settings.style,sc=settings.scale;const h=savedPlace("home"),w=savedPlace("work");$("settingsTitle").textContent=t("settings");$("settingsSubtitle").textContent=t("settingsSub");$("settingsBody").innerHTML=`<div class="pageHead"><div><h1>${t("settings")}</h1><p>${t("settingsSub")}</p></div><button class="closeBtn" data-close>×</button></div><div class="sectionTitle">${t("language")}</div><div class="seg"><button class="langOpt ${lang==="lt"?"on":""}" data-lang="lt">Lietuvių</button><button class="langOpt ${lang==="en"?"on":""}" data-lang="en">English</button></div><div class="sectionTitle">${t("theme")}</div><div class="settingOption"><div><b>${t("light")}</b><span>Light interface</span></div><button class="chip ${th==="light"?"on":""}" data-themeopt="light">${th==="light"?"✓ ":""}${t("light")}</button></div><div class="settingOption"><div><b>${t("dark")}</b><span>Dark interface</span></div><button class="chip ${th==="dark"?"on":""}" data-themeopt="dark">${th==="dark"?"✓ ":""}${t("dark")}</button></div><div class="settingOption"><div><b>${t("time")}</b><span>${new Date().getHours()>=7&&new Date().getHours()<20?"☀️":"🌙"} ${lang==="lt"?"Pagal įrenginio laiką":"Uses your device clock"}</span></div><button class="chip ${th==="time"?"on":""}" data-themeopt="time">${th==="time"?"✓ ":""}${t("time")}</button></div><div class="sectionTitle">${t("style")}</div><div class="settingOption"><div><b>${t("liquid")}</b><span>Blurred, translucent cards</span></div><button class="chip ${st==="liquid"?"on":""}" data-styleopt="liquid">${st==="liquid"?"✓ ":""}${t("liquid")}</button></div><div class="settingOption"><div><b>${t("classic")}</b><span>Solid cards and borders</span></div><button class="chip ${st==="classic"?"on":""}" data-styleopt="classic">${st==="classic"?"✓ ":""}${t("classic")}</button></div><div class="sectionTitle">${t("scale")}</div><div class="seg"><button data-scale="never" class="${sc==="never"?"on":""}">${t("never")}</button><button data-scale="zoom" class="${sc==="zoom"?"on":""}">${t("zoomOnly")}</button><button data-scale="always" class="${sc==="always"?"on":""}">${t("always")}</button></div><div class="sectionTitle">${t("places")}</div><div class="card"><div class="row"><div class="rowMain"><div class="rowTitle">⌂ ${t("home")}</div><div class="rowSub">${h?.address||t("notSet")}</div></div><button class="btn" data-place="home">${h? t("save"):t("save")}</button></div><div class="row"><div class="rowMain"><div class="rowTitle">▣ ${t("work")}</div><div class="rowSub">${w?.address||t("notSet")}</div></div><button class="btn" data-place="work">${t("save")}</button></div></div><div class="sectionTitle">GPS</div><button class="btn full secondary" id="settingsLocate">⌖ ${t("center")}</button>`;bindSettingsEvents()}
function setSettingsOpen(open){const el=$("settingsPage");if(!el)return;if(open){closeSheet();el.classList.add("open");renderSettings()}else{el.classList.remove("open")}}
function render(){if(!sheetOpen)return;if(tab==="map")renderMap();else if(tab==="nav")renderNav()}
function bindCommon(){body.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet);body.querySelectorAll("[data-layer]").forEach(b=>b.onclick=()=>toggleLayer(b.dataset.layer));$("mapLocate")?.addEventListener("click",()=>locate(true,false));$("mapNav")?.addEventListener("click",()=>openSheet("nav"))}
function bindNavEvents(){body.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet);$("useGps")?.addEventListener("click",()=>locate(false,true));$("pickFrom")?.addEventListener("click",()=>startPick("from"));$("pickTo")?.addEventListener("click",()=>startPick("to"));$("navSearch")?.addEventListener("input",e=>searchAddress(e.target.value));$("homeQuick")?.addEventListener("click",()=>chooseSaved("home"));$("workQuick")?.addEventListener("click",()=>chooseSaved("work"));$("clearNav")?.addEventListener("click",()=>{clearNavPoints();clearRoute()});$("saveHome")?.addEventListener("click",()=>openSavedPlaceModal("home"));$("saveWork")?.addEventListener("click",()=>openSavedPlaceModal("work"));$("startNavBtn")?.addEventListener("click",startNavigation);body.querySelectorAll("[data-route]").forEach(b=>b.onclick=()=>selectRoute(+b.dataset.route))}
function bindSettingsEvents(){const sb=$("settingsBody");sb.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;settings.language=lang;store.set("lang",lang);applyTranslations();renderSettings()});sb.querySelectorAll("[data-themeopt]").forEach(b=>b.onclick=()=>{settings.theme=b.dataset.themeopt;store.set("theme",settings.theme);applyTheme();renderSettings()});sb.querySelectorAll("[data-styleopt]").forEach(b=>b.onclick=()=>{settings.style=b.dataset.styleopt;store.set("style",settings.style);applyTheme();renderSettings()});sb.querySelectorAll("[data-scale]").forEach(b=>b.onclick=()=>{settings.scale=b.dataset.scale;store.set("scale",settings.scale);updateScaleVisibility();renderSettings()});sb.querySelectorAll("[data-place]").forEach(b=>b.onclick=()=>openSavedPlaceModal(b.dataset.place));$("settingsLocate")?.addEventListener("click",()=>locate(true,false))}
function applyTranslations(){document.documentElement.lang=lang;document.title=lang==="lt"?"Kaunas dviračiu":"Kaunas by Bike";$("tMap").querySelector("span").textContent=t("map");$("tNav").querySelector("span").textContent=t("nav");}
$("tMap").onclick=()=>openSheet("map");$("tNav").onclick=()=>openSheet("nav");$("settingsBtn").onclick=()=>setSettingsOpen(true);$("settingsClose").onclick=()=>setSettingsOpen(false);$("sheet").addEventListener("click",e=>{if(drag?.moved)e.stopPropagation()},true);

// ---------------- Modal ----------------
function openModal(html){$("modalBody").innerHTML=html;$("modal").style.display="flex";$("modal").querySelectorAll("[data-mclose]").forEach(b=>b.onclick=closeModal)}function closeModal(){$("modal").style.display="none"}
function openHoursModal(kind,id,name,current){openModal(`<div class="modalHead"><h2>${esc(name)}</h2><button class="closeBtn" data-mclose>×</button></div><p>${t("hoursHint")}</p><input class="modalInput" id="hoursInput" value="${esc(current)}"><div class="modalActions"><button class="btn" data-mclose>${t("cancel")}</button><button class="btn primary" id="hoursSave">${t("saveHours")}</button></div>`);$("hoursSave").onclick=()=>{const all=store.get("hours",{});const v=$("hoursInput").value.trim();if(v)all[kind+":"+id]=v;else delete all[kind+":"+id];store.set("hours",all);closeModal();if(layerState[kind])drawLayer(kind)}}

// click map closes popup when not picking; in picking mode map can pan normally
map.on("click",()=>{if(pickMode)return});

// init: nothing selected and sheet closed
applyTranslations();setSheetOpen(false);setSettingsOpen(false);updateScaleVisibility();
</script>
