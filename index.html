<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const T={
 lt:{map:"Žemėlapis",nav:"Navigacija",settings:"Nustatymai",settingsSub:"Prisitaikyk programėlę sau.",layers:"Sluoksniai",layersSub:"Dviračiams naudinga informacija žemėlapyje.",cycle:"Dviračių infrastruktūra",shops:"Dviračių parduotuvės",repair:"Remonto stotelės",rental:"Dviračių nuoma",on:"Įjungta",off:"Išjungta",home:"Namai",work:"Darbas",search:"Ieškoti adreso ar vietos",searchClear:"Išvalyti paiešką",searching:"Ieškoma…",from:"Iš",to:"Į",gps:"Dabartinė vieta",pick:"Pasirinkti žemėlapyje",clear:"Išvalyti",finding:"Ieškoma maršruto…",routeErr:"Nepavyko rasti maršruto",routes:"Maršrutai",recommended:"Dviračiams tinkamiausias",balanced:"Subalansuotas",fast:"Greitas",start:"Pradėti navigaciją",stop:"Baigti navigaciją",steps:"Posūkiai",emptySteps:"Posūkių nėra",locating:"Nustatoma vieta…",locErr:"Nepavyko gauti vietos",center:"Centruoti pagal vietą",theme:"Tema",language:"Kalba",style:"Stilius",light:"Šviesi",dark:"Tamsi",time:"Pagal paros laiką",liquid:"Liquid glass",classic:"Klasikinis",scale:"Žemėlapio mastelis",never:"Niekada",always:"Visada",zoomOnly:"Priartinant / keičiant mastelį",compass:"Kompasas",compassAlways:"Visada",compassRotated:"Kai pasuktas",compassNever:"Niekada",places:"Išsaugotos vietos",save:"Išsaugoti",notSet:"Nenustatyta",saveHome:"Išsaugoti kaip namus",saveWork:"Išsaugoti kaip darbą",routeHome:"Į namus",routeWork:"Į darbą",navigate:"Naviguoti",close:"Uždaryti",chooseHere:"Naviguoti į šią vietą",dismiss:"Uždaryti",tapPlace:"Pasirinkta vieta",openHours:"Darbo laikas",cancel:"Atšaukti",hoursMissing:"Darbo laikas nenurodytas",address:"Adresas",phone:"Telefonas",website:"Svetainė",routeReady:"Maršrutas paruoštas",swipeUp:"Perstumkite meniu aukštyn, kad matytumėte posūkius",live:"GPS navigacija aktyvi",nextTurn:"Kitas posūkis",arrive:"Pasiekėte tikslą",stairs:"Laiptai",crossing:"Perėja",startingPoint:"Priartėkite prie starto taško",homeMissing:"Namai nenustatyti",workMissing:"Darbas nenustatytas",homeSet:"Nustatyti namų adresą",workSet:"Nustatyti da  en:{map:"Map",nav:"Navigate",settings:"Settings",settingsSub:"Make the app feel like yours.",layers:"Layers",layersSub:"Useful cycling information on the map.",cycle:"Cycling infrastructure",shops:"Bike shops",repair:"Repair stations",rental:"Bike rental",on:"On",off:"Off",home:"Home",work:"Work",search:"Search address or place",searchClear:"Clear search",searching:"Searching…",from:"From",to:"To",gps:"Current location",pick:"Pick on map",clear:"Clear",finding:"Finding bike route…",routeErr:"Couldn't find a route",routes:"Routes",recommended:"Bike-friendly",balanced:"Balanced",fast:"Fast",start:"Start navigation",stop:"Exit navigation",steps:"Turns",emptySteps:"No turns",locating:"Getting your location…",locErr:"Couldn't get your location",center:"Center on my location",theme:"Theme",language:"Language",style:"Style",light:"Light",dark:"Dark",time:"By time of day",liquid:"Liquid glass",classic:"Classic",scale:"Map scale",never:"Never",always:"Always",zoomOnly:"While zooming / changing zoom",compass:"Compass",compassAlways:"Always",compassRotated:"When rotated",compassNever:"Never",places:"Saved places",save:"Save",notSet:"Not set",saveHome:"Save as home",saveWork:"Save as work",routeHome:"Home",routeWork:"Work",navigate:"Navigate",close:"Close",chooseHere:"Navigate here",dismiss:"Dismiss",tapPlace:"Selected location",openHours:"Opening hours",cancel:"Cancel",hoursMissing:"Opening hours not listed",address:"Address",phone:"Phone",website:"Website",routeReady:"Route ready",swipeUp:"Swipe the sheet up to see all turns",live:"GPS navigation active",nextTurn:"Next turn",arrive:"You have arrived",stairs:"Stairs",crossing:"Crossing",startingPoint:"Move close to the starting point",homeMissing:"Home not set",workMissing:"Work not set",homeSet:"Set home address",workSet:"Set work address",minutes:m=>`${Math.max(1,Math.round(m/60))} min`,dist:d=>d<1000?`${Math.round(d)} m`:`${(d/1000).toFixed(1)} km`,routeMeta:(d,m)=>`${(d/1000).toFixed(1)} km · ${Math.max(1,Math.round(m/60))} min`}
};
let lang=(localStorage.getItem('kb-lang')||((navigator.language||'').toLowerCase().startsWith('lt')?'lt':'en')); if(!T[lang])lang='lt';
const t=k=>typeof T[lang][k]==='function'?T[lang][k]:T[lang][k];
const store={get(k,f=null){try{const v=localStorage.getItem('kb-'+k);return v===null?f:JSON.parse(v)}catch{return f}},set(k,v){try{localStorage.setItem('kb-'+k,JSON.stringify(v))}catch{}}};
let settings={theme:store.get('theme','light'),style:store.get('style','liquid'),scale:store.get('scale','zoom'),compass:store.get('compass','rotated')};

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function status(msg,busy=false){const s=$('status');if(!msg){s.classList.remove('show');return}s.classList.add('show');$('statusText').textContent=msg;s.querySelector('.spinner').style.display=busy?'block':'none'}
function applyTheme(){const effective=effectiveThemeName();document.documentElement.dataset.theme=effective;document.documentElement.dataset.style=settings.style;if(map&&mapTheme!==effective){mapTheme=effective;map.setStyle(MAP_STYLES[effective])}updateCompass();updateScaleVisibility()}
function themeTick(){if(settings.theme==='time')applyTheme()}
setInterval(themeTick,60000);

const MAP_STYLES={light:'https://tiles.openfreemap.org/styles/liberty',dark:'https://tiles.openfreemap.org/styles/dark'};
let map,mapTheme=null,routeLayerEventsBound=false;
function effectiveThemeName(){return settings.theme==='time'?(new Date().getHours()>=7&&new Date().getHours()<20?'light':'dark'):settings.theme}
function createMap(){
  if(!window.maplibregl){status(lang==='lt'?'Nepavyko įkelti žemėlapio':'Could not load the map library');return}
  const initialTheme=effectiveThemeName();mapTheme=initialTheme;map=new maplibregl.Map({container:'map',style:MAP_STYLES[initialTheme],center:[23.93,54.8985],zoom:13,dragRotate:true,touchPitch:false,pitchWithRotate:false,maxPitch:55,maxZoom:19,minZoom:11,maxBounds:[[23.66,54.76],[24.25,55.03]],maxBoundsViscosity:.72,attributionControl:false});
  map.addControl(new maplibregl.AttributionControl({compact:true}),'bottom-right');
  const scaleCtrl=new maplibregl.ScaleControl({maxWidth:110,unit:'metric'});map.addControl(scaleCtrl,'bottom-left');
  map.on('style.load',()=>{setupMapLayers();drawRoutes();if(layerState.cycle)loadCycle();updateScaleVisibility();});map.on('load',()=>{applyTheme();updateScaleVisibility();initInteractions();});
}

function updateScaleVisibility(){const el=document.querySelector('.maplibregl-ctrl-scale');if(!el)return;const wrap=el.closest('.maplibregl-ctrl-bottom-left');if(wrap)wrap.style.display=settings.scale==='never'?'none':(settings.scale==='always'?'block':'none');if(settings.scale==='zoom'){map.off('zoomstart',showScale);map.off('zoomend',showScale);map.on('zoomstart',showScale);map.on('zoomend',showScale)}else{map.off('zoomstart',showScale);map.off('zoomend',showScale)}}
let scaleTimer=null;function showScale(){const el=document.querySelector('.maplibregl-ctrl-scale');const wrap=el?.closest('.maplibregl-ctrl-bottom-left');if(!wrap)return;wrap.style.display='block';clearTimeout(scaleTimer);scaleTimer=setTimeout(()=>{if(settings.scale==='zoom')wrap.style.display='none'},1700)}

function updateCompass(){if(!map)return;const b=map.getBearing();const main=$('mainCompass'),needle=main.querySelector('.compassNeedle');const show=settings.compass==='always'||(settings.compass==='rotated'&&Math.abs(b)>2);main.style.display=show&&!navActive&&!sheetOpen&&!settingsOpen?'grid':'none';needle.style.transform=`rotate(${-b}deg)`;const navC=$('navCompass'),n=navC.querySelector('.compassNeedle');n.style.transform=`rotate(${-b}deg)`;navC.style.display=navActive?'grid':'none'}
function centerBearing(){if(!map)return;map.easeTo({bearing:0,duration:380})}

const layerState={cycle:false,shops:false,repair:false,rental:false};
const poiData={shops:null,repair:null,rental:null};
const poiMarkers={shops:[],repair:[],rental:[]};
const layerBusy={cycle:false,shops:false,repair:false,rental:false};
const layerLastCenter={shops:null,repair:null,rental:null};
const EPS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter'];
function bbox(){const b=map.getBounds();return `${b.getSouth().toFixed(5)},${b.getWest().toFixed(5)},${b.getNorth().toFixed(5)},${b.getEast().toFixed(5)}`}
async function overpass(q){let last;for(const ep of EPS){try{const c=new AbortController(),tm=setTimeout(()=>c.abort(),18000);const r=await fetch(ep+'?data='+encodeURIComponent(q),{mode:'cors',cache:'no-store',signal:c.signal});clearTimeout(tm);if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();if(!Array.isArray(j.elements))throw new Error('Invalid response');return j}catch(e){last=e}}throw last||new Error('Overpass unavailable')}
function osmAddr(tags){const a=[tags?.['addr:street'],tags?.['addr:housenumber']].filter(Boolean).join(' ');if(!a&&!tags?.['addr:postcode']&&!tags?.['addr:city'])return null;return [a,tags?.['addr:postcode'],tags?.['addr:city']||'Kaunas'].filter(Boolean).join(', ')}
function poiColor(k){return {shops:'#276d8a',repair:'#d3a000',rental:'#2a9d69'}[k]}
function poiEmoji(k){return {shops:'🚲',repair:'🔧',rental:'🚴'}[k]}
function setupMapLayers(){
  if(map.getSource('cycle'))return;
  map.addSource('cycle',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addLayer({id:'cycle-lines',type:'line',source:'cycle',paint:{'line-color':['match',['get','kind'],'dedicated','#e6553d','lane','#ec9a3d','#d68b38'],'line-width':['interpolate',['linear'],['zoom'],11,2.2,15,4.2,19,6],'line-opacity':.9,'line-dasharray':['case',['==',['get','kind'],'lane'],['literal',[3,2]],['literal',[1,0]]]}});
  if(!map.getSource('routes'))map.addSource('routes',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  if(!map.getLayer('route-casing'))map.addLayer({id:'route-casing',type:'line',source:'routes',paint:{'line-color':['case',['==',['get','selected'],1],'#ffffff','#7f8b92'],'line-width':['case',['==',['get','selected'],1],10,5],'line-opacity':['case',['==',['get','selected'],1],.72,.20],'line-cap':'round','line-join':'round'}});
  if(!map.getLayer('route-lines'))map.addLayer({id:'route-lines',type:'line',source:'routes',paint:{'line-color':['case',['==',['get','selected'],1],'#2d6cdf','#7f8b92'],'line-width':['case',['==',['get','selected'],1],6,3.2],'line-opacity':['case',['==',['get','selected'],1],.98,.48],'line-cap':'round','line-join':'round'}});
  if(!routeLayerEventsBound){
    routeLayerEventsBound=true;
    map.on('click','route-lines',e=>{const i=e.features?.[0]?.properties?.index;if(i!==undefined)selectRoute(+i)});
    map.on('mouseenter','route-lines',()=>map.getCanvas().style.cursor='pointer');
    map.on('mouseleave','route-lines',()=>map.getCanvas().style.cursor='');
  }
}
async function loadCycle(){if(!layerState.cycle||!map||layerBusy.cycle)return;layerBusy.cycle=true;layerLastCenter.cycle=map.getCenter();status(t('finding'),true);try{const q=`[out:json][timeout:25];(way["highway"="cycleway"](${bbox()});way["highway"="path"]["bicycle"~"^(yes|designated|permissive)$"](${bbox()});way["highway"="footway"]["bicycle"~"^(yes|designated|permissive)$"](${bbox()});way["cycleway"](${bbox()});way["cycleway:left"](${bbox()});way["cycleway:right"](${bbox()});way["cycleway:both"](${bbox()}););out geom qt;`;const j=await overpass(q);const features=(j.elements||[]).filter(e=>e.geometry?.length>1).map(e=>({type:'Feature',properties:{kind:(e.tags?.highway==='cycleway'||e.tags?.['cycleway']==='track'||e.tags?.['cycleway:left']==='track'||e.tags?.['cycleway:right']==='track'||e.tags?.['cycleway:both']==='track')?'dedicated':'lane'},geometry:{type:'LineString',coordinates:e.geometry.map(p=>[p.lon,p.lat])}}));map.getSource('cycle').setData({type:'FeatureCollection',features});status('')}catch(e){status((lang==='lt'?'Nepavyko įkelti: ':'Couldn’t load: ')+(e?.message||''))}finally{layerBusy.cycle=false}}
async function loadPOI(kind){if(!layerState[kind]||layerBusy[kind])return;layerBusy[kind]=true;layerLastCenter[kind]=map.getCenter();setLayerMessage(kind,t('finding'),true);const bb=bbox();let q='';if(kind==='shops')q=`[out:json][timeout:18];nwr["shop"="bicycle"](${bb});out center qt;`;else if(kind==='repair')q=`[out:json][timeout:18];(nwr["amenity"="bicycle_repair_station"](${bb});nwr["service:bicycle:repair"](${bb}););out center qt;`;else q=`[out:json][timeout:18];(nwr["amenity"="bicycle_rental"](${bb});nwr["rental"="bicycle"](${bb}););out center qt;`;
  try{const j=await overpass(q);poiData[kind]=j.elements||[];renderPOIs(kind);setLayerMessage(kind,'',false)}catch(e){setLayerMessage(kind,(lang==='lt'?'Nepavyko įkelti: ':'Couldn’t load: ')+(e?.message||''),false)}finally{layerBusy[kind]=false}
}
function setLayerMessage(k,msg,busy){const el=$('layerMsg-'+k);if(!el)return;el.textContent=msg;el.className='cardSub '+(busy?'loading':'error');el.style.display=msg?'block':'none'}
function clearPOIs(kind){for(const m of poiMarkers[kind])m.remove();poiMarkers[kind]=[]}
function renderPOIs(kind){clearPOIs(kind);for(const e of poiData[kind]||[]){const ll=e.center?[e.center.lon,e.center.lat]:[e.lon,e.lat];if(!Number.isFinite(ll[0]))continue;const el=document.createElement('button');el.className='poiMarker';el.style.cssText=`width:32px;height:32px;border-radius:12px;background:${poiColor(kind)};border:2px solid white;display:grid;place-items:center;box-shadow:0 5px 14px rgba(0,0,0,.22);font-size:15px;padding:0`;el.textContent=poiEmoji(kind);el.addEventListener('click',ev=>{ev.stopPropagation();showPOIPopup(e,kind)});poiMarkers[kind].push(new maplibregl.Marker({element:el,anchor:'center'}).setLngLat(ll).addTo(map))}}
let activePopup=null;
function showPOIPopup(e,kind){
  if(activePopup){activePopup.remove();activePopup=null}
  const tags=e.tags||{},ll=e.center?[e.center.lon,e.center.lat]:[e.lon,e.lat],name=tags.name||t(kind),h=tags.opening_hours||null,addr=osmAddr(tags)||t('address');
  let html=`<div class="poiPop"><b>${esc(name)}</b><div class="cardSub">${esc(t(kind))}</div><div class="poiLine">📍 ${esc(addr)}</div>`;
  if(h)html+=`<div class="poiLine">🕒 <strong>${esc(t('openHours'))}</strong><br>${esc(h)}</div>`;
  else html+=`<div class="poiLine" style="color:var(--yellow)">🕒 ${esc(t('hoursMissing'))}</div>`;
  if(tags.phone)html+=`<div class="poiLine">☎ ${esc(tags.phone)}</div>`;
  if(tags.website)html+=`<div class="poiLine">🌐 <a href="${esc(tags.website)}" target="_blank" rel="noopener">${esc(tags.website)}</a></div>`;
  html+=`<div class="poiActions"><button data-poi-action="navigate" class="btn secondary">${esc(t('navigate'))}</button><button data-poi-action="close" class="btn">${esc(t('close'))}</button></div></div>`;
  const pop=new maplibregl.Popup({closeButton:true,offset:18,maxWidth:'310px'}).setLngLat(ll).setHTML(html).addTo(map);
  activePopup=pop;
  const root=pop.getElement();
  root?.querySelector('[data-poi-action="navigate"]')?.addEventListener('click',ev=>{ev.preventDefault();ev.stopPropagation();pop.remove();if(activePopup===pop)activePopup=null;setDestination([ll[1],ll[0]],name);openSheet('nav')});
  root?.querySelector('[data-poi-action="close"]')?.addEventListener('click',ev=>{ev.preventDefault();ev.stopPropagation();pop.remove();if(activePopup===pop)activePopup=null});
  pop.on('close',()=>{if(activePopup===pop)activePopup=null});
}

function bindNavSheet(){body.querySelector('[data-close]')?.addEventListener('click',()=>{closeSheet()});$('useGps')?.addEventListener('click',()=>{locate(true);setTimeout(()=>{if(userPosition){setFromCurrent();renderNav();if(nav.to)getRoute()}},700)});$('pickTo')?.addEventListener('click',()=>startPick('to'));$('clearNavBtn')?.addEventListener('click',()=>{clearNavigation();openSheet('nav')});$('homeQuick')?.addEventListener('click',()=>chooseSaved('home'));$('workQuick')?.addEventListener('click',()=>chooseSaved('work'));$('saveHome')?.addEventListener('click',()=>openSavedModal('home'));$('saveWork')?.addEventListener('click',()=>openSavedModal('work'));$('startNavBtn')?.addEventListener('click',startNavigation);$('clearRouteBtn')?.addEventListener('click',()=>{clearRoutesOnly();renderNav()});body.querySelectorAll('[data-route]').forEach(b=>b.addEventListener('click',()=>selectRoute(+b.dataset.route)));const inp=$('navSearch'),clr=$('navSearchClear');if(inp){inp.addEventListener('input',e=>{clr.classList.toggle('visible',!!e.target.value.trim());searchPlaces(e.target.value,'navSearchResults',x=>{setDestination([+x.lat,+x.lon],searchLabel(x));inp.value=searchLabel(x);$('navSearchResults').innerHTML='';$('navSearchResults').style.display='none'})});inp.addEventListener('focus',()=>{if(inp.value.trim())clr.classList.add('visible')})}clr?.addEventListener('click',()=>{inp.value='';clr.classList.remove('visible');$('navSearchResults').innerHTML='';$('navSearchResults').style.display='none';inp.focus()})}

function searchLabel(x){return x.display_name.split(',').slice(0,3).join(', ')}
async function geocode(q,signal){const url=`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&dedupe=1&addressdetails=1&accept-language=${lang}&countrycodes=lt&viewbox=23.70,54.98,24.20,54.78&bounded=1&q=${encodeURIComponent(q)}`;const r=await fetch(url,{mode:'cors',cache:'no-store',signal,headers:{Accept:'application/json'}});if(!r.ok)throw new Error('Geocoder '+r.status);return r.json()}
function searchPlaces(q,id,onPick){const box=$(id);if(!box)return;clearTimeout(searchTimer);const query=q.trim();if(query.length<2){box.innerHTML='';box.style.display='none';return}box.style.display='block';box.innerHTML=`<div class="searchEmpty">${esc(t('searching'))}</div>`;const token=++searchRequest;searchTimer=setTimeout(async()=>{const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),7000);try{const j=await geocode(query,ctl.signal);if(token!==searchRequest)return;box.innerHTML=j.slice(0,5).map(x=>`<button type="button" class="searchItem" data-key="${esc(x.place_id)}"><div class="searchIconDot">⌖</div><div><strong>${esc(x.display_name.split(',')[0])}</strong><small>${esc(x.display_name.split(',').slice(1,4).join(', '))}</small></div></button>`).join('')||`<div class="searchEmpty">${lang==='lt'?'Nieko nerasta':'No results'}</div>`;box.style.display='block';box.querySelectorAll('.searchItem').forEach((b,i)=>b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();onPick(j[i])}))}catch(e){if(e?.name!=='AbortError'){box.innerHTML=`<div class="searchEmpty">${esc(t('routeErr'))}</div>`;box.style.display='block'}}finally{clearTimeout(tm)}},240)}
function syncSearchClear(){const v=$('mainSearchInput').value.trim();$('mainSearchClear').classList.toggle('visible',!!v);if(!v){$('mainSearchResults').innerHTML='';$('mainSearchResults').classList.remove('show');$('mainSearchResults').style.display='none'}}
function selectMainSearch(x){const label=searchLabel(x),ll=[+x.lat,+x.lon];$('mainSearchInput').value=label;syncSearchClear();$('mainSearchResults').innerHTML='';$('mainSearchResults').classList.remove('show');$('mainSearchResults').style.display='none';map.flyTo({center:ll,zoom:16,duration:.55});setDestination(ll,label);openSheet('nav')}

let pickMode=null;
function startPick(which){pickMode=which;hideSheet();document.documentElement.classList.add('pick-active');$('centerPin').style.display='block';$('pickBar').style.display='block';$('pickInfo').textContent=lang==='lt'?'Perstumkite žemėlapį, kad smeigtukas būtų norimoje vietoje.':'Move the map until the center pin is exactly where you want it.';$('pickSelect').textContent=t('pick');}
function finishPick(){if(!pickMode)return;const which=pickMode;pickMode=null;const c=map.getCenter();document.documentElement.classList.remove('pick-active');$('centerPin').style.display='none';$('pickBar').style.display='none';setDestination([c.lat,c.lng],t('pick'));openSheet('nav')}
let longPressTimer=null,longStart=null,longTriggered=false,longPin=null,longLL=null;
function cancelLongPress(){if(longPressTimer){clearTimeout(longPressTimer);longPressTimer=null}}
function onPointerDown(e){if(navActive)return;if(e.originalEvent?.button!==undefined&&e.originalEvent.button!==0)return;const p=e.point;longStart=p;cancelLongPress();longTriggered=false;longPressTimer=setTimeout(()=>{longPressTimer=null;longTriggered=true;const ll=map.unproject(longStart);showLongPress(ll)},650)}
function onPointerMove(e){if(!longStart)return;const dx=e.point.x-longStart.x,dy=e.point.y-longStart.y;if(Math.hypot(dx,dy)>10)cancelLongPress()}
function onPointerUp(){cancelLongPress();longStart=null;if(longTriggered){setTimeout(()=>longTriggered=false,250)}}
async function showLongPress(ll){longLL=[ll.lat,ll.lng];if(longPin)longPin.remove();const el=document.createElement('div');el.innerHTML='<div style="width:28px;height:28px;border-radius:50% 50% 50% 0;background:var(--accent);transform:rotate(-45deg);box-shadow:0 6px 16px rgba(0,0,0,.25)"><div style="width:8px;height:8px;background:white;border-radius:50%;position:absolute;left:10px;top:10px"></div></div>';el.style.width='28px';el.style.height='36px';el.style.display='grid';el.style.placeItems='start center';longPin=new maplibregl.Marker({element:el,anchor:'bottom'}).setLngLat([ll.lng,ll.lat]).addTo(map);$('tapTitle').textContent=t('tapPlace');$('tapSub').textContent=`${ll.lat.toFixed(5)}, ${ll.lng.toFixed(5)}`;$('tapNavigate').textContent=t('chooseHere');$('tapClose').textContent=t('dismiss');$('mapTapBubble').style.display='block';try{const j=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${ll.lat}&lon=${ll.lng}&zoom=18&accept-language=${lang}`,{mode:'cors',cache:'no-store',headers:{Accept:'application/json'}}).then(r=>r.json());if(longLL&&Math.abs(longLL[0]-ll.lat)<.00001){$('tapTitle').textContent=j.display_name?.split(',').slice(0,2).join(', ')||t('tapPlace');$('tapSub').textContent=j.display_name?.split(',').slice(2,5).join(', ')||`${ll.lat.toFixed(5)}, ${ll.lng.toFixed(5)}`}}catch{}}
function hideLongPress(){if(longPin){longPin.remove();longPin=null}longLL=null;$('mapTapBubble').style.display='none'}

function openSheet(next,opts={}){if(navActive)return;if(sheetOpen&&tab===next){closeSheet();return}tab=next;routePeek=!!opts.peek&&next==='nav'&&routeCandidates.length>0;setSheetOpen(true,routePeek)}
function setSheetOpen(open,peek=false){sheetOpen=!!open;routePeek=!!peek&&tab==='nav'&&routeCandidates.length>0;const sh=$('sheet');sh.classList.toggle('open',sheetOpen);sh.classList.toggle('route-peek',sheetOpen&&routePeek);if(!sheetOpen){sh.classList.remove('dragging');sh.style.transform='';tab=null;routePeek=false;$('tMap').setAttribute('aria-selected','false');$('tNav').setAttribute('aria-selected','false')}else{$('tMap').setAttribute('aria-selected',tab==='map');$('tNav').setAttribute('aria-selected',tab==='nav');sh.style.transform=routePeek?'translate3d(-50%,calc(100% - 252px),0)':'translate3d(-50%,0,0)';render()}updateCompass()}
function closeSheet(){if(tab==='nav'){clearNavigation();return}setSheetOpen(false);hideLongPress()}
function hideSheet(){sheetOpen=false;routePeek=false;$('sheet').classList.remove('open','route-peek');$('sheet').style.transform='translate3d(-50%,105%,0)';$('tMap').setAttribute('aria-selected','false');$('tNav').setAttribute('aria-selected','false');tab=null;updateCompass()}
function setRoutePeek(peek){routePeek=!!peek&&routeCandidates.length>0;const sh=$('sheet');sh.classList.toggle('route-peek',routePeek);sh.style.transform=sheetOpen?(routePeek?'translate3d(-50%,calc(100% - 252px),0)':'translate3d(-50%,0,0)'):'translate3d(-50%,105%,0)';if(sheetOpen)renderNav();updateCompass()}

function onSheetPointerDown(e){if(!sheetOpen||navActive)return;dragState={y:e.clientY,lastY:e.clientY,dy:0,started:false};$('sheet').setPointerCapture?.(e.pointerId)}
function onSheetPointerMove(e){if(!dragState)return;const dy=e.clientY-dragState.y;dragState.dy=dy;if(Math.abs(dy)>8&&!dragState.started){const bodyEl=$('body');if(dy>0&&bodyEl.scrollTop>0){dragState=null;return}dragState.started=true;$('sheet').classList.add('dragging')}if(!dragState?.started)return;e.preventDefault();const base=routePeek?Math.max(0,$('sheet').offsetHeight-252):0;const off=Math.max(0,Math.min($('sheet').offsetHeight,base+dy));$('sheet').style.transform=`translate3d(-50%,${off}px,0)`;dragState.lastY=e.clientY}
function onSheetPointerUp(){if(!dragState)return;const d=dragState.dy,started=dragState.started;dragState=null;$('sheet').classList.remove('dragging');if(!started)return;if(d<-55&&tab==='nav'&&routeCandidates.length){setRoutePeek(false);return}if(d>Math.max(75,$('sheet').offsetHeight*.11)){closeSheet();return}$('sheet').style.transform=sheetOpen?(routePeek?'translate3d(-50%,calc(100% - 252px),0)':'translate3d(-50%,0,0)'):'translate3d(-50%,105%,0)'}

function renderSettings(){const h=getSaved('home'),w=getSaved('work');$('settingsTitle').textContent=t('settings');$('settingsSubtitle').textContent=t('settingsSub');$('settingsBody').innerHTML=`<div class="settingTitle">${esc(t('language'))}</div><select class="languageSelect" id="languageSelect" aria-label="${esc(t('language'))}"><option value="lt" ${lang==='lt'?'selected':''}>Lietuvių</option><option value="en" ${lang==='en'?'selected':''}>English</option></select><div class="settingTitle">${esc(t('theme'))}</div><div class="settingRow"><div><b>${esc(t('light'))}</b><span>Light interface</span></div><button class="btn ${settings.theme==='light'?'secondary':''}" data-theme="light">${settings.theme==='light'?'✓ ':''}${esc(t('light'))}</button></div><div class="settingRow"><div><b>${esc(t('dark'))}</b><span>Dark interface</span></div><button class="btn ${settings.theme==='dark'?'secondary':''}" data-theme="dark">${settings.theme==='dark'?'✓ ':''}${esc(t('dark'))}</button></div><div class="settingRow"><div><b>${esc(t('time'))}</b><span>${new Date().getHours()>=7&&new Date().getHours()<20?'☀️':'🌙'} ${lang==='lt'?'Naudoja įrenginio laiką':'Uses device time'}</span></div><button class="btn ${settings.theme==='time'?'secondary':''}" data-theme="time">${settings.theme==='time'?'✓ ':''}${esc(t('time'))}</button></div><div class="settingTitle">${esc(t('style'))}</div><div class="settingRow"><div><b>${esc(t('liquid'))}</b><span>Blurred and translucent</span></div><button class="btn ${settings.style==='liquid'?'secondary':''}" data-style="liquid">${settings.style==='liquid'?'✓ ':''}${esc(t('liquid'))}</button></div><div class="settingRow"><div><b>${esc(t('classic'))}</b><span>Solid surfaces and borders</span></div><button class="btn ${settings.style==='classic'?'secondary':''}" data-style="classic">${settings.style==='classic'?'✓ ':''}${esc(t('classic'))}</button></div><div class="settingTitle">${esc(t('scale'))}</div><div class="seg"><button class="${settings.scale==='never'?'on':''}" data-scale="never">${esc(t('never'))}</button><button class="${settings.scale==='zoom'?'on':''}" data-scale="zoom">${esc(t('zoomOnly'))}</button><button class="${settings.scale==='always'?'on':''}" data-scale="always">${esc(t('always'))}</button></div><div class="settingTitle">${esc(t('compass'))}</div><div class="seg"><button class="${settings.compass==='never'?'on':''}" data-compass="never">${esc(t('compassNever'))}</button><button class="${settings.compass==='rotated'?'on':''}" data-compass="rotated">${esc(t('compassRotated'))}</button><button class="${settings.compass==='always'?'on':''}" data-compass="always">${esc(t('compassAlways'))}</button></div><div class="settingTitle">${esc(t('places'))}</div><div class="card"><div class="cardRow"><div class="miniIcon">⌂</div><div class="savedValue"><div class="cardTitle">${esc(t('home'))}</div><div class="cardSub">${esc(h?.address||t('notSet'))}</div></div><button class="btn" data-place="home">${esc(t('save'))}</button></div><div class="cardRow"><div class="miniIcon">▣</div><div class="savedValue"><div class="cardTitle">${esc(t('work'))}</div><div class="cardSub">${esc(w?.address||t('notSet'))}</div></div><button class="btn" data-place="work">${esc(t('save'))}</button></div></div><button class="btn secondary full settingsLocate" id="settingsLocate">⌖ ${esc(t('center'))}</button>`;bindSettings()}
function bindSettings(){const sb=$('settingsBody');$('languageSelect')?.addEventListener('change',e=>{lang=e.target.value;localStorage.setItem('kb-lang',lang);applyTranslations();renderSettings()});sb.querySelectorAll('[data-theme]').forEach(b=>b.addEventListener('click',()=>{settings.theme=b.dataset.theme;store.set('theme',settings.theme);applyTheme();renderSettings()}));sb.querySelectorAll('[data-style]').forEach(b=>b.addEventListener('click',()=>{settings.style=b.dataset.style;store.set('style',settings.style);applyTheme();renderSettings()}));sb.querySelectorAll('[data-scale]').forEach(b=>b.addEventListener('click',()=>{settings.scale=b.dataset.scale;store.set('scale',settings.scale);updateScaleVisibility();renderSettings()}));sb.querySelectorAll('[data-compass]').forEach(b=>b.addEventListener('click',()=>{settings.compass=b.dataset.compass;store.set('compass',settings.compass);updateCompass();renderSettings()}));sb.querySelectorAll('[data-place]').forEach(b=>b.addEventListener('click',()=>openSavedModal(b.dataset.place)));$('settingsLocate')?.addEventListener('click',()=>locate(true))}
let settingsOpen=false;function setSettingsOpen(open){settingsOpen=!!open;const p=$('settingsPage');p.style.display=settingsOpen?'block':'none';if(settingsOpen){hideSheet();renderSettings()}else{updateCompass()}}
function applyTranslations(){document.documentElement.lang=lang;document.title=lang==='lt'?'Kaunas dviračiu':'Kaunas by Bike';$('tMap').querySelector('span').textContent=t('map');$('tNav').querySelector('span').textContent=t('nav');$('mainSearchInput').placeholder=t('search');$('mainSearchInput').setAttribute('aria-label',t('search'));$('mainSearchClear').setAttribute('aria-label',t('searchClear'));$('stopNav').textContent=t('stop');$('tapNavigate').textContent=t('chooseHere');$('tapClose').textContent=t('dismiss');syncSearchClear();if(settingsOpen)renderSettings();if(sheetOpen)render()}
function render(){if(!sheetOpen)return;if(tab==='map')renderMap();else if(tab==='nav')renderNav()}

function bindGlobal(){
  $('tMap').addEventListener('click',()=>openSheet('map'));
  $('tNav').addEventListener('click',()=>openSheet('nav'));
  $('settingsBtn').addEventListener('click',()=>setSettingsOpen(true));
  $('settingsClose').addEventListener('click',()=>setSettingsOpen(false));
  $('locationFab').addEventListener('click',()=>locate(true));
  $('mainCompass').addEventListener('click',centerBearing);
  $('navCompass').addEventListener('click',centerBearing);
  $('navRecenter').addEventListener('click',()=>{
    if(!userPosition)return;
    navFollowing=true;
    map.easeTo({center:[userPosition[1],userPosition[0]],zoom:17,bearing:effectiveNavBearing(),pitch:45,duration:450});
    updateCentered();
  });
  $('navExpand').addEventListener('click',e=>{e.stopPropagation();toggleNavDetails()});
  $('navBottomHead').addEventListener('click',toggleNavDetails);
  $('stopNav').addEventListener('click',()=>stopNavigation({clear:true}));
  $('tapNavigate').addEventListener('click',()=>{
    if(!longLL)return;
    const ll=[longLL[0],longLL[1]];
    hideLongPress();
    setDestination(ll,t('chooseHere'));
    openSheet('nav');
  });
  $('tapClose').addEventListener('click',hideLongPress);$('pickSelect').addEventListener('click',finishPick);
  const input=$('mainSearchInput');
  input.addEventListener('input',e=>{syncSearchClear();searchPlaces(e.target.value,'mainSearchResults',selectMainSearch)});
  input.addEventListener('focus',()=>{if(input.value.trim())$('mainSearchClear').classList.add('visible')});
  $('mainSearchClear').addEventListener('click',e=>{
    e.preventDefault();e.stopPropagation();input.value='';syncSearchClear();input.focus({preventScroll:true});
  });
  $('mainSearchResults').addEventListener('click',e=>e.stopPropagation());
  const sh=$('sheet');
  sh.addEventListener('pointerdown',onSheetPointerDown);
  sh.addEventListener('pointermove',onSheetPointerMove,{passive:false});
  sh.addEventListener('pointerup',onSheetPointerUp);
  sh.addEventListener('pointercancel',onSheetPointerUp);
}
function initInteractions(){
 map.on('move',()=>{updateCentered();updateCompass()});map.on('rotate',updateCompass);map.on('zoomend',updateCentered);map.on('moveend',()=>{const c=map.getCenter();for(const k of ['shops','repair','rental'])if(layerState[k]&&!layerBusy[k]){const prev=layerLastCenter[k];if(!poiData[k]||!prev||mapDistance([prev.lat,prev.lng],[c.lat,c.lng])>1800)loadPOI(k)}if(layerState.cycle&&!layerBusy.cycle){const prev=layerLastCenter.cycle;if(!prev||mapDistance([prev.lat,prev.lng],[c.lat,c.lng])>1800)loadCycle()}});
 map.on('dragstart',()=>{if(navActive)navFollowing=false});map.on('rotatestart',()=>{if(navActive)navFollowing=false});
 map.on('click',()=>{if(longTriggered)return;hideLongPress();if(sheetOpen&&!navActive)closeSheet()});
 map.on('mousedown',onPointerDown);map.on('mousemove',onPointerMove);map.on('mouseup',onPointerUp);map.on('touchstart',e=>{if(e.points?.[0])onPointerDown({point:e.points[0],originalEvent:{button:0}})});map.on('touchmove',e=>{if(e.points?.[0])onPointerMove({point:e.points[0]})});map.on('touchend',onPointerUp);
 $('navMode').style.display='none';applyTranslations();applyTheme();setSheetOpen(false,false);hideLongPress();updateCompass();
}

function openSavedModal(kind){const title=kind==='home'?t('home'):t('work');$('modalBody').innerHTML=`<div class="modalHead"><h2>${esc(title)}</h2><button class="settingsClose" id="modalClose">×</button></div><div class="modalText">${esc(lang==='lt'?'Įrašykite adresą. Jis bus saugomas šiame įrenginyje.':'Enter an address. It will be saved on this device.')}</div><input class="modalInput" id="savedAddress" placeholder="Žemaičių g. 1, Kaunas"><div class="modalActions"><button class="btn" id="modalCancel">${esc(t('cancel'))}</button><button class="btn primary" id="savedSave">${esc(t('save'))}</button></div>`;$('modal').style.display='flex';$('modalClose').onclick=closeModal;$('modalCancel').onclick=closeModal;$('savedSave').onclick=async()=>{const q=$('savedAddress').value.trim();if(q.length<3)return;status(t('finding'),true);try{const j=await geocode(q);if(!j.length)throw 0;const x=j[0];store.set(kind,{address:searchLabel(x),ll:[+x.lat,+x.lon]});closeModal();status('');if(settingsOpen)renderSettings();if(sheetOpen&&tab==='nav')renderNav()}catch{status(t('routeErr'))}}}
function closeModal(){$('modal').style.display='none'}

function loadMapLibre(done){
  if(window.maplibregl){done();return}
  const a=document.createElement('script');a.src='https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js';a.onload=done;a.onerror=()=>{const b=document.createElement('script');b.src='https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js';b.onload=done;b.onerror=()=>status(lang==='lt'?'Nepavyko įkelti žemėlapio bibliotekos':'Could not load the map library');document.head.appendChild(b)};document.head.appendChild(a)
}
// init
applyTranslations();
bindGlobal();
loadMapLibre(createMap);
})();
</script>
